name: Deploy to IONOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the verified main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SITE_URL: https://www.raulmermans.com
      SFTP_HOST: ${{ secrets.SFTP_HOST || secrets.SFTP_SERVER }}
      SFTP_USER: ${{ secrets.SFTP_USER || secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_PORT: ${{ secrets.SFTP_PORT || 22 }}
      SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        run: |
          test -n "$SFTP_HOST" || { echo "Missing SFTP_HOST secret."; exit 1; }
          test -n "$SFTP_USER" || { echo "Missing SFTP_USER secret."; exit 1; }
          test -n "$SFTP_PASSWORD" || { echo "Missing SFTP_PASSWORD secret."; exit 1; }
          test -n "$SFTP_REMOTE_PATH" || { echo "Missing SFTP_REMOTE_PATH secret."; exit 1; }

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Verify deployment payload
        run: |
          npm run verify:export
          npm run verify:canonical

      - name: Write deployment fingerprint
        run: |
          {
            echo "sha=${{ github.event.workflow_run.head_sha }}"
            echo "run_id=${{ github.event.workflow_run.id }}"
            echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > out/deploy-version.txt

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to IONOS via SFTP
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" \
            -e "set cmd:fail-exit true; set net:timeout 60; set net:max-retries 2; set net:reconnect-interval-base 5; set net:reconnect-interval-multiplier 1; set sftp:auto-confirm yes; mirror --reverse --delete --verbose ./out/ $SFTP_REMOTE_PATH; bye"

      - name: Verify production deployment
        env:
          DEPLOY_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --silent --show-error \
            -H "Cache-Control: no-cache" \
            "https://www.raulmermans.com/deploy-version.txt?v=${DEPLOY_VERSION}" \
            --output /tmp/deploy-version.txt

          grep -Fq "sha=${DEPLOY_VERSION}" /tmp/deploy-version.txt

          verify_copy() {
            url="$1"
            output="$2"
            expected="$3"

            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error \
                -H "Cache-Control: no-cache" \
                "${url}?v=${DEPLOY_VERSION}-${attempt}" \
                --output "$output"

              if grep -Fq "$expected" "$output"; then
                return 0
              fi

              sleep 10
            done

            return 1
          }

          verify_copy "https://www.raulmermans.com/en/" /tmp/raul-en.html "Building ideas into brands, products, and ventures."
          verify_copy "https://www.raulmermans.com/" /tmp/raul-es.html "Convirtiendo ideas en marcas, productos y nuevos proyectos."
          verify_copy "https://www.raulmermans.com/en/case-studies/" /tmp/cases-en.html "Campaign Sandbox"
          verify_copy "https://www.raulmermans.com/case-studies/" /tmp/cases-es.html "Campaign Sandbox"
          verify_copy "https://www.raulmermans.com/en/case-studies/blogagent/" /tmp/blogagent-en.html "reviewer veto before publication"
          verify_copy "https://www.raulmermans.com/case-studies/blogagent/" /tmp/blogagent-es.html "poder de veto antes de publicar"
          verify_copy "https://www.raulmermans.com/en/services/ai-integrations/" /tmp/service-ai-en.html "AI Integrations for Creative Systems"
          verify_copy "https://www.raulmermans.com/services/integraciones-ia/" /tmp/service-ai-es.html "Integraciones IA para Sistemas Creativos"

          ! grep -Fq "href=\"/es/" /tmp/raul-es.html
          ! grep -Fq "Request an AI Workflow Audit" /tmp/raul-en.html
          ! grep -Fq "Marketing + CRM" /tmp/raul-en.html
