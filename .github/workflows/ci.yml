name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
    inputs:
      refresh_all_visual_baselines:
        description: Capture and verify Linux baselines for all protected routes, then upload them for review
        required: false
        type: boolean
        default: false
      refresh_case_study_visual_baselines:
        description: Refresh only the case-study index desktop/mobile visual baselines and upload them for review
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and static export checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.raulmermans.com
    steps:
      - name: Keep baseline capture off the deployment branch
        if: github.event_name == 'workflow_dispatch' && (inputs.refresh_all_visual_baselines || inputs.refresh_case_study_visual_baselines)
        run: test "${{ github.ref }}" != "refs/heads/main"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: npm run verify:export

      - name: Verify portfolio experience system
        run: npm run verify:experience-system

      - name: Verify public route registry
        run: npm run verify:route-registry

      - name: Verify project taxonomy
        run: npm run verify:project-taxonomy

      - name: Lint portfolio design-system boundaries
        run: npm run lint:design-system

      - name: Prove experience guards reject drift
        run: npm run test:experience-guards

      - name: Verify canonical HTML contract
        run: npm run verify:canonical

      - name: Check DemandOS public copy
        run: |
          set -euo pipefail

          grep -Fq "Inventory decisions from raw commerce data" out/en/case-studies/demandos/index.html
          grep -Fq "Decisiones de inventario desde datos raw de comercio" out/case-studies/demandos/index.html

          ! grep -Eiq "pending|screenshot pending|still pending|to be added|coming soon|placeholder|TBD|pendiente" out/en/case-studies/demandos/index.html
          ! grep -Eiq "pending|screenshot pending|still pending|to be added|coming soon|placeholder|TBD|pendiente" out/case-studies/demandos/index.html

          ! grep -Fq "Volver a casos" out/en/case-studies/demandos/index.html
          ! grep -Fq "Allowed vs blocked" out/case-studies/demandos/index.html

      - name: Check generated deployment payload
        run: |
          set -euo pipefail

          test -f out/index.html
          test -f out/en/index.html
          test -f out/case-studies/demandos/index.html
          test -f out/en/case-studies/demandos/index.html
          test -f out/images/case-studies/demandos/02-home-dashboard.png

  critical-e2e:
    name: Critical browser and accessibility checks
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.raulmermans.com
      PLAYWRIGHT_WEB_SERVER_COMMAND: python3 -m http.server 3000 --bind 127.0.0.1 --directory out
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build browser-test static export
        run: npm run build

      - name: Refresh all Linux visual baselines
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_all_visual_baselines
        run: >-
          npm run test:e2e:update -- tests/playwright/visual-regression.spec.ts
          tests/playwright/positioning-parity.spec.ts --workers=2

      - name: Verify refreshed Linux visual baselines
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_all_visual_baselines
        run: >-
          npm run test:e2e -- tests/playwright/visual-regression.spec.ts
          tests/playwright/positioning-parity.spec.ts tests/playwright/photography-loading.spec.ts
          --workers=2 --update-snapshots=none

      - name: Upload Linux baseline candidates
        if: always() && github.event_name == 'workflow_dispatch' && inputs.refresh_all_visual_baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-visual-baselines
          path: |
            tests/playwright/visual-regression.spec.ts-snapshots/linux/*.png
            tests/playwright/positioning-parity.spec.ts-snapshots/linux/*.png
          if-no-files-found: error

      - name: Refresh case-study visual baselines
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_case_study_visual_baselines && !inputs.refresh_all_visual_baselines
        run: >-
          npm run test:e2e:update -- tests/playwright/visual-regression.spec.ts
          -g 'case-studies is visually stable'

      - name: Upload refreshed case-study visual baselines
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_case_study_visual_baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: case-study-visual-baselines
          path: tests/playwright/visual-regression.spec.ts-snapshots/linux/case-studies-*.png
          if-no-files-found: error

      - name: Run critical Playwright suite
        if: github.event_name != 'workflow_dispatch' || (inputs.refresh_case_study_visual_baselines != true && inputs.refresh_all_visual_baselines != true)
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
