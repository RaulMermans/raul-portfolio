name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and static export checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.raulmermans.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: npm run verify:export

      - name: Verify portfolio experience system
        run: npm run verify:experience-system

      - name: Verify canonical HTML contract
        run: npm run verify:canonical

      - name: Check DemandOS public copy
        run: |
          set -euo pipefail

          grep -Fq "Inventory decisions from raw commerce data" out/en/case-studies/demandos/index.html
          grep -Fq "Decisiones de inventario desde datos raw de comercio" out/case-studies/demandos/index.html

          ! grep -Eiq "pending|screenshot pending|still pending|to be added|coming soon|placeholder|TBD|pendiente" out/en/case-studies/demandos/index.html
          ! grep -Eiq "pending|screenshot pending|still pending|to be added|coming soon|placeholder|TBD|pendiente" out/case-studies/demandos/index.html

          ! grep -Fq "Volver a casos" out/en/case-studies/demandos/index.html
          ! grep -Fq "Allowed vs blocked" out/case-studies/demandos/index.html

      - name: Check generated deployment payload
        run: |
          set -euo pipefail

          test -f out/index.html
          test -f out/en/index.html
          test -f out/case-studies/demandos/index.html
          test -f out/en/case-studies/demandos/index.html
          test -f out/images/case-studies/demandos/02-home-dashboard.png

  critical-e2e:
    name: Critical browser and accessibility checks
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.raulmermans.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run critical Playwright suite
        run: npm run test:e2e
