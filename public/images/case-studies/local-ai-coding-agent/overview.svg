  <text x="112" y="590" fill="#FAF8F5" font-family="Arial,sans-serif" font-size="27" font-weight="700">Permission checks · Human review · Verification</text>
  <text x="1116" y="661" text-anchor="end" fill="#5B544D" font-family="monospace" font-size="16">ILLUSTRATIVE PUBLIC MODEL</text>
