<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Local coding agent runtime</title>
  <desc id="description">Repository evidence enters a bounded context compiler and agent loop. A local model gateway, permission checks, and verification surround tool use.</desc>
  <rect width="1200" height="720" fill="#EEE8DE"/>
  <path d="M42 42h1116v636H42z" fill="none" stroke="#D8D2CB" stroke-width="2"/>
  <text x="84" y="103" fill="#C41E3A" font-family="monospace" font-size="20" letter-spacing="4">PUBLIC ARCHITECTURE / LOCAL AGENT</text>
  <text x="84" y="169" fill="#1A1714" font-family="Arial,sans-serif" font-size="48" font-weight="700">A bounded coding loop.</text>
  <path d="M84 206h1032" stroke="#1A1714" stroke-width="2"/>
  <g fill="#FAF8F5" stroke="#D8D2CB" stroke-width="2">
    <rect x="84" y="258" width="318" height="196"/>
    <rect x="441" y="258" width="318" height="196"/>
    <rect x="798" y="258" width="318" height="196"/>
  </g>
  <g fill="#C41E3A" font-family="monospace" font-size="18" letter-spacing="2">
    <text x="112" y="301">01 / EVIDENCE</text>
    <text x="469" y="301">02 / REASON</text>
    <text x="826" y="301">03 / ACT</text>
  </g>
  <g fill="#1A1714" font-family="Arial,sans-serif" font-size="27" font-weight="700">
    <text x="112" y="359">Repository context</text>
    <text x="469" y="359">Local model gateway</text>
    <text x="826" y="359">Tool loop</text>
  </g>
  <g fill="#5B544D" font-family="Arial,sans-serif" font-size="19">
    <text x="112" y="401">Bounded observations</text>
    <text x="469" y="401">Turn budget and memory</text>
    <text x="826" y="401">Inspect, edit, verify</text>
  </g>
  <g stroke="#C41E3A" stroke-width="4" fill="none">
    <path d="M408 356h26m-10-10 10 10-10 10"/>
    <path d="M765 356h26m-10-10 10 10-10 10"/>
  </g>
  <path d="M84 502h1032v122H84z" fill="#1A1714"/>
